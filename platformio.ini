; PlatformIO project for the Maggy firmware.
; Provides reproducible builds with pinned library versions.
;
; Usage:
;   cp XiaoDevModeTest/secrets.example.h XiaoDevModeTest/secrets.h   (then edit)
;   pio run                  ; build
;   pio run --target upload  ; flash over USB
;   pio device monitor       ; serial @ 115200
;
; NOTE: confirm `board` matches your exact Seeed Xiao ESP32 variant.
;   - Xiao ESP32-C3 : seeed_xiao_esp32c3
;   - Xiao ESP32-S3 : seeed_xiao_esp32s3
;   - Xiao ESP32-C6 : seeed_xiao_esp32c6

[platformio]
src_dir = XiaoDevModeTest

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200

; Pinned to versions compatible with the current sketch.
; ArduinoJson is held at v6 because the code uses DynamicJsonDocument
; (migration to v7 is tracked in docs/ROADMAP.md).
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SH110X @ ^2.1.10
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    ayushsharma82/ElegantOTA @ ^3.1.1
    mobizt/Firebase ESP32 Client @ ^4.4.14
    bblanchon/ArduinoJson @ ^6.21.5
